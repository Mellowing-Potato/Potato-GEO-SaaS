name: Release images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  publish:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # Use the automatic job token for private or public source access;
      # authentication lasts for this fetch only and is not saved in Git config.
      - name: Fetch source
        env:
          SOURCE_SERVER: ${{ github.server_url }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          git init .
          source_auth=$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)
          echo "::add-mask::$source_auth"
          git -c protocol.version=2 -c "http.extraheader=AUTHORIZATION: basic $source_auth" fetch --no-tags --depth=1 "$SOURCE_SERVER/$SOURCE_REPOSITORY.git" "$SOURCE_COMMIT"
          unset SOURCE_TOKEN source_auth
          git switch --detach FETCH_HEAD
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          test -n "$VERSION"
          echo "tag=ghcr.io/${REPOSITORY,,}:$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
